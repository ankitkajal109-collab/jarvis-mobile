<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="arcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="85%" stop-color="#0f172a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#030712" stop-opacity="1" />
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="#030712" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="12 8" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.6" filter="url(#neon)" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#06b6d4" stroke-width="8" stroke-dasharray="24 12" />
  <circle cx="256" cy="256" r="100" fill="url(#arcGlow)" />
  <!-- Core segments -->
  <g stroke="#e0f2fe" stroke-width="6" filter="url(#neon)">
    <line x1="256" y1="120" x2="256" y2="155" />
    <line x1="256" y1="357" x2="256" y2="392" />
    <line x1="120" y1="256" x2="155" y2="256" />
    <line x1="357" y1="256" x2="392" y2="256" />
    <line x1="160" y1="160" x2="185" y2="185" />
    <line x1="352" y1="352" x2="327" y2="327" />
    <line x1="352" y1="160" x2="327" y2="185" />
    <line x1="160" y1="352" x2="185" y2="327" />
  </g>
  <circle cx="256" cy="256" r="42" fill="#ffffff" filter="url(#neon)" />
  <circle cx="256" cy="256" r="24" fill="#38bdf8" />
</svg>
